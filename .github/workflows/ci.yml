name: Run tests

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Run tests (Go ${{ matrix.go-version }})

    strategy:
      fail-fast: false
      matrix:
        # Los DOS toolchains del doble flujo (ADR-023 §1 + T001):
        #   1.20.14 — legacy: el último Go que sirve Win7/8/8.1/Server 2008 R2
        #             y 2012. Compila el binario legacy que va dentro del
        #             instalador de Windows.
        #   1.26.5  — moderno: Linux y macOS ya salen con él; Windows moderno
        #             se suma cuando aterrice T015.
        #
        # Correrlos en MATRIZ es el gate de W-GOT-02: que UN SOLO árbol de
        # fuentes alimente los dos toolchains, sin rama paralela, sin build
        # tags y sin fork de dependencias. Hasta hoy esa invariante no la
        # verificaba nadie — se sostenía sobre una medición puntual. Si un PR
        # de Dependabot sube x/crypto/x/net/x/text (sus versiones parcheadas
        # exigen Go >=1.25), el job legacy es el que se cae y avisa.
        go-version: ['1.20.14', '1.26.5']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Ensure linux agent compiles
        run: |
          ARCHS='amd64 386 arm64 arm'
          for i in ${ARCHS}; do
            env CGO_ENABLED=0 GOOS=linux GOARCH=${i} go build -ldflags "-s -w"
          done
      
      - name: Ensure windows agent compiles
        run: |
          ARCHS='amd64 386'
          for i in ${ARCHS}; do
            env CGO_ENABLED=0 GOOS=windows GOARCH=${i} go build -ldflags "-s -w"
          done
      
      # Sin cgo el proveedor macOS cae al stub de geolocation_nocgo_darwin.go y
      # degrada a IP. Este paso existe para garantizar que ese camino siga
      # compilando: es la red de seguridad de la feature 025.
      - name: Ensure mac agent compiles (sin cgo, camino stub)
        run: |
          ARCHS='amd64 arm64'
          for i in ${ARCHS}; do
            env CGO_ENABLED=0 GOOS=darwin GOARCH=${i} go build -ldflags "-s -w"
          done

      - name: Run unit tests
        run: go test ./...

  # El proveedor real de macOS (CoreLocation) es Objective-C vía cgo, así que no
  # se puede cross-compilar desde Linux: necesita SDK de macOS. Este job compila
  # de verdad esa ruta para que un error de cgo no llegue al release.
  macos-cgo:
    runs-on: macos-latest
    name: Ensure mac agent compiles (cgo + CoreLocation)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Build darwin/arm64 con cgo
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
        run: go build -ldflags "-s -w" -o /dev/null

      - name: Run unit tests (darwin)
        run: go test ./...
