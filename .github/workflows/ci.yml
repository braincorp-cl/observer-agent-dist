name: Run tests

on:
  # `**` y no `*`: en los filtros de rama de GitHub el `*` NO cruza barras, asi
  # que con `"*"` este workflow no corria en NINGUNA rama de trabajo
  # (`fix/030-...`, `feature/...`) pese a declarar que queria correr en todas.
  # El sintoma es traicionero: `gh run list --commit <sha>` devuelve vacio, y el
  # vacio se lee como "todavia no arranco" cuando en realidad no iba a arrancar
  # nunca. Medido el 2026-08-11 con la rama de la Fase 0 de la 030.
  push:
    branches:
      - "**"
  # Aca el filtro es la rama DESTINO, que no lleva barras (`main`), asi que el
  # `*` alcanzaba. Se deja igual que el de arriba por consistencia: dos globs
  # distintos en el mismo archivo invitan a suponer que la diferencia significa
  # algo.
  pull_request:
    branches:
      - "**"

jobs:
  no-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Block legacy upstream strings
    # Gate de rebrand, agregado el 2026-08-03. Este repo no tenia ninguno: la
    # limpieza de referencias al producto de origen se hizo a mano y sin gate
    # vuelve a entrar sola en el proximo backport desde upstream.
    #
    # Espejo del gate de observer-rmm-dist. Tres familias: el producto legacy
    # ('tactical' como token + formas pegadas), el proveedor ('amidaware') y el
    # prefijo 'trmm' (migrado a 'ormm': alias de import, header del agente,
    # prefijos de temporales).
    #
    # Exclusiones de linea IRREDUCIBLES, y ninguna es branding. Las dos nombran
    # repositorios DE TERCEROS, que no nos toca renombrar:
    #
    #   1. 'amidaware/taskmaster' es un MODULO GO (bindings del Task Scheduler de
    #      Windows) del que depende agent/tasks_windows.go. No se puede renombrar
    #      —es el paquete de otro— y tocarlo rompe el build e invalida go.sum.
    #
    #   2. 'wh1te909/trmm-shared' aparece en shared/types.go como ATRIBUCION del
    #      origen de los tipos inlineados. Se agrego el 2026-08-05 tras descubrir
    #      que el rebrand automatico trmm->ormm le habia aplicado el sed al nombre
    #      del repo ajeno, dejando `wh1te909/ormm-shared` — que da 404. Renombrar
    #      la cita de un tercero no limpia nada: fabrica una referencia falsa.
    steps:
      - uses: actions/checkout@v7

      - name: Scan for legacy strings
        run: |
          set -uo pipefail

          PATTERN='tacticalrmm|tacticalagent|tacticalmesh|tactical([^a-z]|$)|amidaware|trmm'

          HITS=$(grep -rniE "$PATTERN" . \
            --exclude-dir=.git \
            --exclude-dir=vendor \
            --exclude=CHANGELOG.md \
            | grep -vE '^\.?/?\.github/workflows/ci\.yml:' \
            | grep -vE 'amidaware/taskmaster' \
            | grep -vE 'wh1te909/trmm-shared' \
            || true)

          # Los NOMBRES de archivo tambien cuentan: `grep -r` mira contenidos.
          PATHS=$(git ls-files | grep -iE "$PATTERN" || true)

          if [ -n "$HITS" ] || [ -n "$PATHS" ]; then
            echo "::error::Legacy upstream strings detected outside the documented allowlist."
            if [ -n "$HITS" ]; then echo ""; echo "Hits (contenido):"; echo "$HITS"; fi
            if [ -n "$PATHS" ]; then echo ""; echo "Hits (nombre de archivo):"; echo "$PATHS"; fi
            exit 1
          fi

          echo "::notice::No new legacy upstream strings detected."

  build:
    runs-on: ubuntu-latest
    # el mas lento medido: 7 min
    timeout-minutes: 20
    name: Run tests (Go ${{ matrix.go-version }})

    strategy:
      fail-fast: false
      matrix:
        # Los DOS toolchains del doble flujo (ADR-023 §1 + T001):
        #   1.20.14 — legacy: el último Go que sirve Win7/8/8.1/Server 2008 R2
        #             y 2012. Compila el binario legacy que va dentro del
        #             instalador de Windows.
        #   1.26.5  — moderno: Linux y macOS ya salen con él; Windows moderno
        #             se suma cuando aterrice T015.
        #
        # Correrlos en MATRIZ es el gate de W-GOT-02: que UN SOLO árbol de
        # fuentes alimente los dos toolchains, sin rama paralela, sin build
        # tags y sin fork de dependencias. Hasta hoy esa invariante no la
        # verificaba nadie — se sostenía sobre una medición puntual. Si un PR
        # de Dependabot sube x/crypto/x/net/x/text (sus versiones parcheadas
        # exigen Go >=1.25), el job legacy es el que se cae y avisa.
        go-version: ['1.20.14', '1.26.5']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Ensure linux agent compiles
        run: |
          ARCHS='amd64 386 arm64 arm'
          for i in ${ARCHS}; do
            env CGO_ENABLED=0 GOOS=linux GOARCH=${i} go build -ldflags "-s -w"
          done
      
      - name: Ensure windows agent compiles
        run: |
          ARCHS='amd64 386'
          for i in ${ARCHS}; do
            env CGO_ENABLED=0 GOOS=windows GOARCH=${i} go build -ldflags "-s -w"
          done
      
      # Sin cgo el proveedor macOS cae al stub de geolocation_nocgo_darwin.go y
      # degrada a IP. Este paso existe para garantizar que ese camino siga
      # compilando: es la red de seguridad de la feature 025.
      - name: Ensure mac agent compiles (sin cgo, camino stub)
        run: |
          ARCHS='amd64 arm64'
          for i in ${ARCHS}; do
            env CGO_ENABLED=0 GOOS=darwin GOARCH=${i} go build -ldflags "-s -w"
          done

      - name: Run unit tests
        run: go test ./...

  # El proveedor real de macOS (CoreLocation) es Objective-C vía cgo, así que no
  # se puede cross-compilar desde Linux: necesita SDK de macOS. Este job compila
  # de verdad esa ruta para que un error de cgo no llegue al release.
  macos-cgo:
    runs-on: macos-latest
    # macOS descuenta x10: 51 s medidos, tope corto a proposito
    timeout-minutes: 10
    name: Ensure mac agent compiles (cgo + CoreLocation)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'

      - name: Build darwin/arm64 con cgo
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
        run: go build -ldflags "-s -w" -o /dev/null

      - name: Run unit tests (darwin)
        run: go test ./...
