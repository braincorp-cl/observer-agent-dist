name: Corte de versión del instalador Windows

# TEST PERMANENTE. Custodia el mecanismo sobre el que descansa la §Enmienda del
# ADR-023: que el instalador —y no el backend— elija entre el binario legacy y
# el moderno, con MinVersion: 10.0 / OnlyBelowVersion: 10.0 sobre dos entradas
# de [Files] que comparten DestName.
#
# POR QUÉ ES PERMANENTE Y NO UNA VERIFICACIÓN DE UNA VEZ:
# el modo de falla que vigila es SILENCIOSO Y SE VE COMO ÉXITO. Si InnoSetup
# dejara de reportar la versión verdadera (GetVersionEx devuelve 6.2 en Win8.1+
# sin manifestar), MinVersion: 10.0 no se cumpliría nunca, TODO Windows moderno
# recibiría el binario legacy —sin parches de seguridad de Go desde 2023— y el
# instalador terminaría en éxito. Nadie lo notaría hasta auditar un equipo.
#
# Y las dos piezas que podrían romperlo NO viven en este repo: `choco install
# innosetup` trae SIEMPRE la última versión de InnoSetup, y la imagen de
# windows-latest se renueva sola. De ahí el cron semanal: los disparadores por
# push/PR sólo cazan cambios nuestros.
#
# NO construye producto ni publica nada.
#
# ALCANCE (actualizado al aterrizar T017, 2026-08-02). Tres jobs, y cada uno
# responde algo que los otros dos no pueden:
#
#   1. `probe`          — ¿la MECÁNICA de InnoSetup discrimina por versión?
#                         Es el único que puede INVERTIR las condiciones, porque
#                         compila una sonda aparte. Sobre el setup.iss real no se
#                         puede: no hay control invertido de un archivo de producto.
#   2. `real-setup-iss` — ¿el setup.iss REAL, el que se publica, elige bien?
#                         Con testigos de texto en vez de binarios: acá se mide la
#                         selección, no el agente. Evita además que el instalador
#                         registre un servicio en el runner.
#   3. `estructura`     — ¿las dos entradas siguen redactadas como deben?
#                         Barato, sin runner Windows, y caza el modo de falla que
#                         ninguna corrida detecta: que las dos entradas dejen de
#                         compartir DestName, o que una condición desaparezca.
#
# LO QUE NO PUEDE RESPONDER: el comportamiento en Windows 7/8/8.1. GitHub no
# ofrece runners de esas versiones, así que la rama OnlyBelowVersion queda
# probada sólo por inversión lógica. Esa mitad sigue 🔴 y exige máquina real
# (T026).
#
# Tampoco responde con qué Go se compiló cada binario: eso vive en el
# `release.yml`, donde los binarios existen de verdad (T020).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - '.github/workflows/verify-inno-dual-select.yml'
  pull_request:
    paths:
      - 'build/**'
      - '.github/workflows/verify-inno-dual-select.yml'
  # Lunes 09:00 UTC. Caza la deriva que no pasa por un commit nuestro: versión
  # nueva de InnoSetup desde chocolatey, o imagen nueva de windows-latest.
  schedule:
    - cron: '0 9 * * 1'

jobs:
  probe:
    name: Selección por versión en Windows real
    runs-on: windows-latest
    # Windows descuenta x2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Identificar el Windows del runner (fuente independiente)
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "RUNNER_CAPTION=$($os.Caption)"      | Tee-Object -Append runner-os.txt
          "RUNNER_VERSION=$($os.Version)"      | Tee-Object -Append runner-os.txt
          "RUNNER_BUILD=$($os.BuildNumber)"    | Tee-Object -Append runner-os.txt

      # La version de InnoSetup NO esta pinneada a proposito: queremos que este
      # test se entere cuando chocolatey traiga una nueva. Se registra para que,
      # el dia que falle, el log diga QUE cambio.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Preparar los dos testigos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $PWD 'probe_src'
          New-Item -ItemType Directory -Force -Path $src, (Join-Path $PWD 'probe_out') | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $src 'modern.txt'), 'MODERN')
          [System.IO.File]::WriteAllText((Join-Path $src 'legacy.txt'), 'LEGACY')
          Get-ChildItem $src | Out-String | Write-Host
          foreach ($f in 'modern.txt','legacy.txt') {
            if (-not (Test-Path (Join-Path $src $f))) { throw "no se creo $f" }
          }

      - name: Compilar sonda normal y sonda invertida
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $src  = (Resolve-Path probe_src).Path
          $out  = (Resolve-Path probe_out).Path
          $log = & $iscc "build\probe-dual-select.iss" "/DSrc=$src" "/O$out" "/Fdualprobe" 2>&1
          if ($LASTEXITCODE -ne 0) { $log | Out-String | Write-Host; throw "ISCC falló en la sonda normal" }
          $log | Out-String | Write-Host

          # La version sale de aqui y no del ejecutable: ISCC.exe no lleva
          # FileVersion (devuelve 0.0.0.0) y su banner es identico entre
          # versiones. La linea "Compiler engine version:" es la unica fuente
          # que distingue una version de otra, que es el punto de registrarla.
          $m = $log | Select-String -Pattern 'Compiler engine version:\s*(.+)$'
          $ver = if ($m) { $m.Matches[0].Groups[1].Value.Trim() } else { '<NO DETECTADA>' }
          "INNO_VERSION=$ver" | Tee-Object -Append runner-os.txt
          & $iscc "build\probe-dual-select.iss" "/DSrc=$src" "/DFLIP=1" "/O$out" "/Fdualprobe-flip"
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló en la sonda invertida" }

      # El veredicto se lee del DISCO, nunca del log: Inno registra también los
      # archivos que DESCARTA por condición de versión, así que buscar
      # "modern.txt" en el log da un falso positivo garantizado.
      - name: Ejecutar la sonda normal
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force C:\dualprobe -ErrorAction SilentlyContinue
          & .\probe_out\dualprobe.exe /VERYSILENT /LOG=$PWD\log-normal.txt | Out-Null
          Start-Sleep -Seconds 2
          if (Test-Path C:\dualprobe\selected.txt) {
            Copy-Item C:\dualprobe\selected.txt selected-normal.txt
          }

      - name: Ejecutar la sonda invertida
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force C:\dualprobe -ErrorAction SilentlyContinue
          & .\probe_out\dualprobe-flip.exe /VERYSILENT /LOG=$PWD\log-flip.txt | Out-Null
          Start-Sleep -Seconds 2
          if (Test-Path C:\dualprobe\selected.txt) {
            Copy-Item C:\dualprobe\selected.txt selected-flip.txt
          }

      - name: Veredicto
        shell: pwsh
        run: |
          $realBuild = [int](Get-CimInstance Win32_OperatingSystem).BuildNumber
          $m = Select-String -Path log-normal.txt -Pattern 'PROBE_DETECTED_VERSION=(.+)$'
          $detected = if ($m) { $m.Matches[0].Groups[1].Value.Trim() } else { '<NO REPORTADO>' }

          $normalPick = if (Test-Path selected-normal.txt) { (Get-Content -Raw selected-normal.txt).Trim() } else { '<NADA INSTALADO>' }
          $flipPick   = if (Test-Path selected-flip.txt)   { (Get-Content -Raw selected-flip.txt).Trim() }   else { '<NADA INSTALADO>' }

          Write-Host "=============== VEREDICTO ==============="
          Get-Content runner-os.txt | ForEach-Object { Write-Host $_ }
          Write-Host "Build real del runner (Win32_OperatingSystem) : $realBuild"
          Write-Host "Version que REPORTA InnoSetup                 : $detected"
          Write-Host "Sonda normal   (modern=MinVersion 10.0)       : $normalPick"
          Write-Host "Sonda invertida (legacy=MinVersion 10.0)      : $flipPick"
          Write-Host "========================================="

          $fail = $false

          # P1 — la trampa del manifest. Si Inno reportara 6.x en un Windows 10+,
          # MinVersion: 10.0 jamás se cumpliría y todo caería a legacy en silencio.
          if ($realBuild -ge 10240 -and $detected -notlike '10.*') {
            Write-Host "::error::P1 FALLA — InnoSetup reporta '$detected' en un build $realBuild. Miente: la variante InnoSetup del ADR-023 NO es viable."
            $fail = $true
          } else {
            Write-Host "P1 OK — InnoSetup reporta la version verdadera ($detected), no 6.x."
          }

          # P2 — que discrimine y no dependa del orden de [Files].
          if ($normalPick -ne 'MODERN') {
            Write-Host "::error::P2 FALLA — la sonda normal instalo '$normalPick', se esperaba MODERN."
            $fail = $true
          }
          if ($flipPick -ne "LEGACY") {
            Write-Host "::error::P2 FALLA — la sonda invertida instalo '$flipPick', se esperaba LEGACY. Si coincide con la normal, decide el ORDEN y no la condicion."
            $fail = $true
          }
          if (-not $fail) {
            Write-Host "P2 OK — invertir las condiciones sin tocar el orden cambio el archivo instalado."
          }

          if ($fail) { exit 1 }

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-evidence
          path: |
            log-normal.txt
            log-flip.txt
            runner-os.txt
            selected-normal.txt
            selected-flip.txt
          retention-days: 7

  # El instalador de PRODUCTO, no la sonda. Compila `build/setup.iss` tal cual se
  # publica y comprueba que en un Windows moderno deja en disco el binario
  # moderno. Es lo que cierra la brecha que este workflow arrastraba: hasta T017,
  # el mecanismo estaba verificado en un archivo que no era el que se envía.
  #
  # Los "binarios" son testigos de texto A PROPÓSITO, por dos razones:
  #   - lo que se mide acá es la SELECCIÓN, y para eso un archivo distinguible
  #     alcanza; el toolchain de cada binario se mide en el release.yml (T020);
  #   - con testigos, el `-m installsvc` del DeinitializeSetup no tiene nada que
  #     registrar, así que este job no deja un servicio dando vueltas en el runner:
  #     el "observeragent.exe" instalado es un archivo de texto y Windows se niega
  #     a ejecutarlo. Esa —y no el /DIR— es la razón por la que el job es inocuo.
  #     Hasta el arreglo de las rutas divergentes 386 × x64, el DeinitializeSetup
  #     tenía el directorio fijo y el /DIR bastaba para dejarlo apuntando al vacío;
  #     ahora usa {app}, que sí es el directorio donde este job instala.
  real-setup-iss:
    name: El setup.iss real elige el binario moderno
    runs-on: windows-latest
    # ESTE es el job que se colgo 6 h el 2026-08-08 y se llevo 1.444 min de cuota; 49 s medidos
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # Los testigos son EJECUTABLES DE VERDAD, no archivos de texto, y la razon
      # no es estetica.
      #
      # `DeinitializeSetup` corre `cmd.exe /c observeragent.exe -m installsvc` con
      # `ewWaitUntilTerminated`. Con un testigo de texto esa llamada NO RETORNA
      # NUNCA -medido el 2026-08-09: el log del instalador se corta en
      # "Deinitializing Setup." y no llega a escribir "install service:" ni
      # "Log closed."-, asi que el proceso quedaba colgado y el paso lo abandonaba
      # al vencer su espera. Ese cuelgue es el que se llevo 1.444 min de cuota.
      #
      # Y mientras el testigo no fuera ejecutable, este job era ESTRUCTURALMENTE
      # incapaz de afirmar nada sobre `DeinitializeSetup`: cualquier cambio ahi
      # -codigo que atraviesa toda instalacion y toda actualizacion de la flota
      # Windows- quedaba fuera de su alcance, y su modo de falla es mudo
      # (instalador en exito, servicio muerto).
      #
      # El stub deja su rastro en el DIRECTORIO DE TRABAJO que recibio, que es
      # justamente el `{app}` que `setup.iss` expande. Eso convierte en verificable
      # el invariante que el comentario de build/setup.iss explica y que hasta hoy
      # no vigilaba nadie.
      - name: Compilar los dos testigos con el nombre real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $PWD 'stage_real'
          $gos = Join-Path $PWD 'testigo_src'
          New-Item -ItemType Directory -Force -Path $src, $gos, (Join-Path $PWD 'out_real') | Out-Null

          # La etiqueta queda como string EN EL BINARIO, para poder saber cual de
          # los dos instalo Inno sin depender de que el stub haya llegado a correr:
          # el veredicto de seleccion por version tiene que sobrevivir a que
          # DeinitializeSetup se rompa, o una regresion ahi taparia a la otra.
          $plantilla = @'
          package main

          import (
          	"os"
          	"path/filepath"
          	"strings"
          )

          const etiqueta = "OBSERVER-TESTIGO-XXETIQUETAXX"

          func main() {
          	wd, err := os.Getwd()
          	if err != nil {
          		os.Exit(1)
          	}
          	rastro := etiqueta + "|" + wd + "|" + strings.Join(os.Args[1:], " ")
          	if err := os.WriteFile(filepath.Join(wd, "installsvc-testigo.txt"), []byte(rastro), 0644); err != nil {
          		os.Exit(1)
          	}
          }
          '@

          Push-Location $gos
          'module testigo' + "`n" + 'go 1.20' | Set-Content -Encoding ascii go.mod
          foreach ($e in 'MODERN','LEGACY') {
            $plantilla -replace 'XXETIQUETAXX', $e | Set-Content -Encoding ascii main.go
            $dst = Join-Path $src ('observeragent-' + $e.ToLower() + '.exe')
            $env:GOOS = 'windows'; $env:GOARCH = 'amd64'
            go build -o $dst .
            if ($LASTEXITCODE -ne 0) { throw "go build fallo para el testigo $e" }
          }
          Pop-Location

          # Los nombres son los que espera build/setup.iss. Si alguien los cambia
          # ahí sin cambiarlos acá, ISCC falla en compilación: es intencional.
          foreach ($f in 'observeragent-modern.exe','observeragent-legacy.exe') {
            $p = Join-Path $src $f
            if (-not (Test-Path $p)) { throw "no se compilo $f" }
            Write-Host ("{0}: {1} bytes" -f $f, (Get-Item $p).Length)
          }

      - name: Compilar el instalador real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $src  = (Resolve-Path stage_real).Path
          $out  = (Resolve-Path out_real).Path
          & $iscc "build\setup.iss" "/DAgentSrc=$src" "/DMyAppVersion=0.0.0" "/O$out" "/Frealprobe"
          if ($LASTEXITCODE -ne 0) { throw "ISCC fallo compilando build/setup.iss" }

      - name: Instalar y leer el veredicto del disco
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\observer-real-check'
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          # NO usar `& exe | Out-Null`: el pipe hace que PowerShell espere a que se
          # CIERRE el flujo de salida, no a que el proceso termine, y el hijo que
          # Inno se desprende hereda ese handle. Medido el 2026-08-09: el instalador
          # completo su trabajo en 6 s ("Installation process succeeded" en
          # log-real.txt) y el paso siguio colgado 9 min 26 s sin emitir una linea,
          # hasta que lo mato el timeout-minutes del job. Dos jobs asi corrieron
          # hasta el techo de 6 h de GitHub el 2026-08-08 y se llevaron el 53 % de
          # la cuota del mes. Start-Process no engancha pipes; Wait-Process espera
          # al PROCESO y lleva su propio limite.
          $exe = (Resolve-Path .\out_real\realprobe.exe).Path
          $p = Start-Process -FilePath $exe -PassThru -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES',"/DIR=$dest","/LOG=$PWD\log-real.txt"
          $p | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue

          # Se espera al efecto en disco, no al exit code: el .exe de Inno se
          # desprende de la consola y puede retornar antes de terminar.
          $placed   = Join-Path $dest 'observeragent.exe'
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $placed) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }

          $realBuild = [int](Get-CimInstance Win32_OperatingSystem).BuildNumber

          # El veredicto se lee del DISCO, nunca del log: Inno registra también los
          # archivos que DESCARTA por condicion de version, asi que un grep sobre el
          # log da un falso positivo garantizado.
          #
          # La etiqueta se saca del BINARIO instalado, no del rastro que deja el
          # stub al correr: asi la seleccion por version se sigue midiendo aunque
          # DeinitializeSetup se rompa. Si dependiera del rastro, una regresion ahi
          # taparia a la otra y las dos se verian como el mismo rojo.
          $pick = '<NADA INSTALADO>'
          if (Test-Path $placed) {
            $txt = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($placed))
            if ($txt -match 'OBSERVER-TESTIGO-(MODERN|LEGACY)') { $pick = $Matches[1] }
            else { $pick = '<BINARIO SIN ETIQUETA>' }
          }

          # El rastro del stub. Su sola existencia prueba que DeinitializeSetup
          # llego a ejecutar el binario instalado; su contenido dice con que
          # directorio de trabajo lo hizo, o sea a que expandio {app}.
          $rastro    = Join-Path $dest 'installsvc-testigo.txt'
          $corrio    = Test-Path $rastro
          $appVisto  = '<NO CORRIO>'
          $argsVisto = '<NO CORRIO>'
          $etqVista  = '<NO CORRIO>'
          if ($corrio) {
            $campos = ((Get-Content -Raw $rastro).Trim() -split '\|')
            $etqVista  = $campos[0]
            $appVisto  = $campos[1]
            $argsVisto = if ($campos.Count -gt 2) { $campos[2] } else { '' }
          }

          Write-Host "=============== VEREDICTO (setup.iss real) ==============="
          Write-Host "Build real del runner : $realBuild"
          Write-Host "DestName en disco     : $placed"
          Write-Host "Binario instalado     : $pick"
          Write-Host "DeinitializeSetup     : corrio=$corrio  etiqueta=$etqVista"
          Write-Host "  {app} que expandio  : $appVisto   (se espera $dest)"
          Write-Host "  argumentos          : $argsVisto   (se espera -m installsvc)"
          Write-Host "=========================================================="

          if ($realBuild -lt 10240) {
            Write-Host "::warning::runner con build $realBuild (<10240): este job asume Windows 10+."
            exit 0
          }
          if ($pick -eq 'LEGACY') {
            throw "el setup.iss real dejo el binario LEGACY en un Windows $realBuild. El corte MinVersion: 10.0 no esta discriminando: toda la flota moderna recibiria un agente sin parches de Go desde 2023, y el instalador terminaria en exito."
          }
          if ($pick -ne 'MODERN') {
            throw "el setup.iss real no dejo ningun binario en disco ($pick)."
          }

          # De aca abajo, lo que el job no podia afirmar mientras el testigo fue un
          # archivo de texto.
          if (-not $corrio) {
            throw "DeinitializeSetup no ejecuto el binario instalado: no aparecio $rastro. Es el procedimiento que hace '-m installsvc' y 'net start' en TODA instalacion de la flota Windows, y su falla es muda: el instalador reporta exito y el servicio nunca arranca."
          }
          if ($etqVista -ne "OBSERVER-TESTIGO-$pick") {
            throw "el binario que corrio ($etqVista) no es el que Inno instalo (OBSERVER-TESTIGO-$pick)."
          }
          if ($appVisto -ne $dest) {
            throw "DeinitializeSetup expandio {app} a '$appVisto' y no a '$dest'. Ese valor es el que le dice al agente donde quedo instalado: con el equivocado se repite la divergencia de 32/64 bits que origino toda esta ronda."
          }
          if ($argsVisto -notmatch '-m\s+installsvc') {
            throw "DeinitializeSetup llamo al binario con '$argsVisto' en vez de '-m installsvc'."
          }
          Write-Host "OK - el instalador de producto entrega el binario moderno en Windows $realBuild,"
          Write-Host "     y DeinitializeSetup lo ejecuto con '-m installsvc' en $appVisto."

      # El guard de arquitectura, medido en un Windows x64 de verdad.
      #
      # El PAR importa y por eso vive en este job: el paso anterior ya probó que
      # SIN `/DArch` el mismo setup.iss instala perfectamente en este runner
      # (control negativo, el guard no bloquea de más). Acá se compila el MISMO
      # archivo con `/DArch=386` y se exige que NO instale nada (control
      # positivo). Si sólo se midiera uno de los dos, un guard que bloquee
      # siempre y un guard que no bloquee nunca se verían igual de verdes.
      #
      # El veredicto se lee del DISCO, nunca del código de salida: el .exe de Inno
      # se desprende de la consola y puede retornar antes de terminar.
      - name: El instalador 386 se niega a instalarse de cero en un x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $src  = (Resolve-Path stage_real).Path
          $out  = (Resolve-Path out_real).Path
          & $iscc "build\setup.iss" "/DAgentSrc=$src" "/DArch=386" "/DMyAppVersion=0.0.0" "/O$out" "/Farch386probe"
          if ($LASTEXITCODE -ne 0) { throw "ISCC fallo compilando setup.iss con /DArch=386" }

          $dest = 'C:\observer-arch-guard-check'
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          # Sin pipe, por lo mismo que el paso anterior. Y aca importa el doble:
          # este control espera que NO se instale nada, asi que un wait demasiado
          # corto daria un verde falso -el guard se veria bien solo porque no le
          # dimos tiempo de fallar-. Se espera al proceso y despues se deja
          # asentar el disco.
          $exe = (Resolve-Path .\out_real\arch386probe.exe).Path
          $p = Start-Process -FilePath $exe -PassThru -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES',"/DIR=$dest","/LOG=$PWD\log-arch-guard.txt"
          $p | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          $realBuild = [int](Get-CimInstance Win32_OperatingSystem).BuildNumber
          $instalado = Test-Path (Join-Path $dest 'observeragent.exe')

          Write-Host "=============== VEREDICTO (guard de arquitectura) ==============="
          Write-Host "Runner            : build $realBuild, 64 bits (los runners de GitHub lo son)"
          Write-Host "Instalador        : el MISMO setup.iss, compilado con /DArch=386"
          Write-Host "Instalacion previa: ninguna (HKLM\SOFTWARE\ObserverRMM ausente en el runner)"
          Write-Host "Dejo binario      : $instalado   (se espera False)"
          Write-Host "================================================================="

          if ($instalado) {
            throw "el guard NO bloqueo: el instalador de 32 bits se instalo en un Windows de 64 bits sin instalacion previa. Ese equipo quedaria con la autoactualizacion muerta y el inventario incompleto, sin sintoma visible."
          }

          # "No quedo binario en disco" es cierto tanto si el guard aborto limpio
          # como si el instalador se cayo a pedazos. Hasta el 2026-08-09 el gate
          # solo miraba eso, y pasaba en verde mientras DeinitializeSetup reventaba
          # con un "Runtime error" que el usuario veia DESPUES del mensaje que le
          # explica que hacer. Se afirma sobre el log, que es donde eso se ve.
          $glog = "$PWD\log-arch-guard.txt"
          # ${glog} y no $glog — PowerShell lee un `$var:` como calificador de ambito.
          if (-not (Test-Path $glog)) { throw "el instalador no dejo log en ${glog}: no se puede afirmar COMO aborto." }
          $gtxt = Get-Content -Raw $glog

          # Control positivo: que el log sea del camino del guard y no de otra cosa.
          if ($gtxt -notmatch 'ABORTADO') {
            throw "el log no contiene la marca ABORTADO del guard: no quedo binario en disco, pero por otra razon. Un guard que no bloquea y un instalador que se cae se ven igual desde el disco."
          }
          if ($gtxt -match 'raised an exception|Runtime error') {
            $linea = ($gtxt -split "`n" | Select-String -Pattern 'raised an exception|Runtime error' | Select-Object -First 1)
            throw "el guard aborto, pero el instalador reventó al salir: $linea. El usuario ve un error crudo justo despues del mensaje que le explica que hacer, y parece un instalador roto."
          }
          Write-Host "OK - el instalador de 32 bits se nego a instalarse de cero en un x64,"
          Write-Host "     y salio limpio: sin excepcion en DeinitializeSetup."

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-setup-iss-evidence
          path: |
            log-real.txt
            log-arch-guard.txt
          retention-days: 7

  # Afirma sobre la REDACCIÓN de las dos entradas, no sobre una corrida. Existe
  # porque los modos de falla de esta pieza son mudos en tiempo de ejecución
  # sobre un runner moderno: si las dos entradas dejan de compartir DestName, el
  # equipo termina con dos ejecutables y un servicio apuntando al que no es; si
  # se cae la línea legacy, Win7 deja de recibir binario y nadie lo nota desde
  # acá, porque no hay runner Win7 que falle.
  estructura:
    name: Las dos entradas de [Files] siguen bien redactadas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verificar build/setup.iss
        run: |
          set -uo pipefail
          iss=build/setup.iss
          fail=0
          assert() {
            if [ "$1" = "ok" ]; then echo "OK   $2"; else echo "::error::$2"; fail=1; fi
          }

          n=$(grep -c '^Source:' "$iss")
          [ "$n" -eq 2 ] && r=ok || r=no
          assert "$r" "[Files] tiene exactamente 2 entradas Source (encontradas: $n)."

          n=$(grep '^Source:' "$iss" | grep -c 'DestName: "{#MyAppExeName}"')
          [ "$n" -eq 2 ] && r=ok || r=no
          assert "$r" "las 2 entradas comparten DestName (encontradas: $n). Sin DestName comun el equipo termina con dos ejecutables."

          grep '^Source:' "$iss" | grep -F 'observeragent-modern.exe' | grep -q 'MinVersion: 10\.0' && r=ok || r=no
          assert "$r" "el binario moderno esta condicionado con MinVersion: 10.0."

          grep '^Source:' "$iss" | grep -F 'observeragent-legacy.exe' | grep -q 'OnlyBelowVersion: 10\.0' && r=ok || r=no
          assert "$r" "el binario legacy esta condicionado con OnlyBelowVersion: 10.0."

          # El piso del instalador NO es el corte. Si alguien lo confunde y lo sube
          # a 10.0, Win7 deja de poder instalar y la rama legacy queda muerta.
          grep -q '^MinVersion=6\.1$' "$iss" && r=ok || r=no
          assert "$r" "[Setup] conserva el piso global MinVersion=6.1 (Win7 SP1)."

          # --- Guard de arquitectura ---
          # El modo de falla que se vigila acá es MUDO: si el macro /DArch deja de
          # pasarse, `Arch` cae a su valor por defecto, el guard no se dispara
          # nunca y el instalador compila y funciona igual. Nadie lo notaria hasta
          # encontrar otro equipo con el agente de 32 bits sobre un x64.
          grep -q "'{#Arch}' = '386'" "$iss" && r=ok || r=no
          assert "$r" "setup.iss conserva el guard de arquitectura (compara Arch con 386)."

          grep -q 'IsWin64' "$iss" && r=ok || r=no
          assert "$r" "el guard sigue condicionado a IsWin64."

          # Sin esta parte el guard bloquearia tambien la ACTUALIZACION, y un
          # equipo ya en el estado malo nunca recibiria el arreglo que lo repara.
          grep -q "RegKeyExists(HKEY_LOCAL_MACHINE, 'SOFTWARE\\\\ObserverRMM')" "$iss" && r=ok || r=no
          assert "$r" "el guard sigue exceptuando a las instalaciones que YA tienen agente (solo bloquea la instalacion nueva)."

          rel=.github/workflows/release.yml
          # ⚠️ EL PATRON VA ESCAPADO CARACTER POR CARACTER, y no es un adorno: es
          # lo unico que impide que Actions se coma esta linea antes que el shell.
          #
          # Actions sustituye las expresiones de los bloques `run:` buscando la
          # apertura literal —un dolar seguido de dos llaves— y NO existe escape
          # con backslash en su sintaxis. Escrito de la forma obvia, con esa
          # apertura tal cual y un backslash delante, Actions igual evalua
          # `matrix.goarch`; este job no tiene matrix, la expresion se resuelve a
          # vacio y el shell termina recibiendo `grep -q '/DArch=\'`: backslash
          # final, o sea `grep: Trailing backslash`, rc=2 y este assert en rojo
          # PARA SIEMPRE con release.yml perfectamente correcto. Medido el
          # 2026-08-08 con GNU grep 3.12, la misma familia que ubuntu-latest.
          #
          # Escapando cada caracter, el dolar y las dos llaves nunca quedan
          # contiguos en el fuente: Actions no ve ninguna apertura que sustituir y
          # grep -E los lee como literales. NO "simplificar" esto de vuelta a la
          # forma legible, y NO escribir esa apertura en estos comentarios: el
          # texto de un comentario tambien pasa por la sustitucion, y ahi el
          # sintoma es peor —el workflow entero deja de parsear—.
          #
          # Se afirma el VALOR y no solo la bandera a proposito: un `/DArch=amd64`
          # hardcodeado dejaria pasar el macro y apagaria el guard igual.
          grep -qE '/DArch=\$\{\{ *matrix\.goarch *\}\}' "$rel" && r=ok || r=no
          assert "$r" "release.yml sigue pasando /DArch=<goarch de la matriz> al compilar el instalador (sin el macro, o con un valor fijo, el guard es inerte)."

          exit $fail
