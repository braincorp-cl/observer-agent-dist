name: Corte de versión del instalador Windows

# TEST PERMANENTE. Custodia el mecanismo sobre el que descansa la §Enmienda del
# ADR-023: que el instalador —y no el backend— elija entre el binario legacy y
# el moderno, con MinVersion: 10.0 / OnlyBelowVersion: 10.0 sobre dos entradas
# de [Files] que comparten DestName.
#
# POR QUÉ ES PERMANENTE Y NO UNA VERIFICACIÓN DE UNA VEZ:
# el modo de falla que vigila es SILENCIOSO Y SE VE COMO ÉXITO. Si InnoSetup
# dejara de reportar la versión verdadera (GetVersionEx devuelve 6.2 en Win8.1+
# sin manifestar), MinVersion: 10.0 no se cumpliría nunca, TODO Windows moderno
# recibiría el binario legacy —sin parches de seguridad de Go desde 2023— y el
# instalador terminaría en éxito. Nadie lo notaría hasta auditar un equipo.
#
# Y las dos piezas que podrían romperlo NO viven en este repo: `choco install
# innosetup` trae SIEMPRE la última versión de InnoSetup, y la imagen de
# windows-latest se renueva sola. De ahí el cron semanal: los disparadores por
# push/PR sólo cazan cambios nuestros.
#
# NO construye producto ni publica nada.
#
# ALCANCE (actualizado al aterrizar T017, 2026-08-02). Tres jobs, y cada uno
# responde algo que los otros dos no pueden:
#
#   1. `probe`          — ¿la MECÁNICA de InnoSetup discrimina por versión?
#                         Es el único que puede INVERTIR las condiciones, porque
#                         compila una sonda aparte. Sobre el setup.iss real no se
#                         puede: no hay control invertido de un archivo de producto.
#   2. `real-setup-iss` — ¿el setup.iss REAL, el que se publica, elige bien?
#                         Con testigos de texto en vez de binarios: acá se mide la
#                         selección, no el agente. Evita además que el instalador
#                         registre un servicio en el runner.
#   3. `estructura`     — ¿las dos entradas siguen redactadas como deben?
#                         Barato, sin runner Windows, y caza el modo de falla que
#                         ninguna corrida detecta: que las dos entradas dejen de
#                         compartir DestName, o que una condición desaparezca.
#
# LO QUE NO PUEDE RESPONDER: el comportamiento en Windows 7/8/8.1. GitHub no
# ofrece runners de esas versiones, así que la rama OnlyBelowVersion queda
# probada sólo por inversión lógica. Esa mitad sigue 🔴 y exige máquina real
# (T026).
#
# Tampoco responde con qué Go se compiló cada binario: eso vive en el
# `release.yml`, donde los binarios existen de verdad (T020).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - '.github/workflows/verify-inno-dual-select.yml'
  pull_request:
    paths:
      - 'build/**'
      - '.github/workflows/verify-inno-dual-select.yml'
  # Lunes 09:00 UTC. Caza la deriva que no pasa por un commit nuestro: versión
  # nueva de InnoSetup desde chocolatey, o imagen nueva de windows-latest.
  schedule:
    - cron: '0 9 * * 1'

jobs:
  probe:
    name: Selección por versión en Windows real
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Identificar el Windows del runner (fuente independiente)
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "RUNNER_CAPTION=$($os.Caption)"      | Tee-Object -Append runner-os.txt
          "RUNNER_VERSION=$($os.Version)"      | Tee-Object -Append runner-os.txt
          "RUNNER_BUILD=$($os.BuildNumber)"    | Tee-Object -Append runner-os.txt

      # La version de InnoSetup NO esta pinneada a proposito: queremos que este
      # test se entere cuando chocolatey traiga una nueva. Se registra para que,
      # el dia que falle, el log diga QUE cambio.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Preparar los dos testigos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $PWD 'probe_src'
          New-Item -ItemType Directory -Force -Path $src, (Join-Path $PWD 'probe_out') | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $src 'modern.txt'), 'MODERN')
          [System.IO.File]::WriteAllText((Join-Path $src 'legacy.txt'), 'LEGACY')
          Get-ChildItem $src | Out-String | Write-Host
          foreach ($f in 'modern.txt','legacy.txt') {
            if (-not (Test-Path (Join-Path $src $f))) { throw "no se creo $f" }
          }

      - name: Compilar sonda normal y sonda invertida
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $src  = (Resolve-Path probe_src).Path
          $out  = (Resolve-Path probe_out).Path
          $log = & $iscc "build\probe-dual-select.iss" "/DSrc=$src" "/O$out" "/Fdualprobe" 2>&1
          if ($LASTEXITCODE -ne 0) { $log | Out-String | Write-Host; throw "ISCC falló en la sonda normal" }
          $log | Out-String | Write-Host

          # La version sale de aqui y no del ejecutable: ISCC.exe no lleva
          # FileVersion (devuelve 0.0.0.0) y su banner es identico entre
          # versiones. La linea "Compiler engine version:" es la unica fuente
          # que distingue una version de otra, que es el punto de registrarla.
          $m = $log | Select-String -Pattern 'Compiler engine version:\s*(.+)$'
          $ver = if ($m) { $m.Matches[0].Groups[1].Value.Trim() } else { '<NO DETECTADA>' }
          "INNO_VERSION=$ver" | Tee-Object -Append runner-os.txt
          & $iscc "build\probe-dual-select.iss" "/DSrc=$src" "/DFLIP=1" "/O$out" "/Fdualprobe-flip"
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló en la sonda invertida" }

      # El veredicto se lee del DISCO, nunca del log: Inno registra también los
      # archivos que DESCARTA por condición de versión, así que buscar
      # "modern.txt" en el log da un falso positivo garantizado.
      - name: Ejecutar la sonda normal
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force C:\dualprobe -ErrorAction SilentlyContinue
          & .\probe_out\dualprobe.exe /VERYSILENT /LOG=$PWD\log-normal.txt | Out-Null
          Start-Sleep -Seconds 2
          if (Test-Path C:\dualprobe\selected.txt) {
            Copy-Item C:\dualprobe\selected.txt selected-normal.txt
          }

      - name: Ejecutar la sonda invertida
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force C:\dualprobe -ErrorAction SilentlyContinue
          & .\probe_out\dualprobe-flip.exe /VERYSILENT /LOG=$PWD\log-flip.txt | Out-Null
          Start-Sleep -Seconds 2
          if (Test-Path C:\dualprobe\selected.txt) {
            Copy-Item C:\dualprobe\selected.txt selected-flip.txt
          }

      - name: Veredicto
        shell: pwsh
        run: |
          $realBuild = [int](Get-CimInstance Win32_OperatingSystem).BuildNumber
          $m = Select-String -Path log-normal.txt -Pattern 'PROBE_DETECTED_VERSION=(.+)$'
          $detected = if ($m) { $m.Matches[0].Groups[1].Value.Trim() } else { '<NO REPORTADO>' }

          $normalPick = if (Test-Path selected-normal.txt) { (Get-Content -Raw selected-normal.txt).Trim() } else { '<NADA INSTALADO>' }
          $flipPick   = if (Test-Path selected-flip.txt)   { (Get-Content -Raw selected-flip.txt).Trim() }   else { '<NADA INSTALADO>' }

          Write-Host "=============== VEREDICTO ==============="
          Get-Content runner-os.txt | ForEach-Object { Write-Host $_ }
          Write-Host "Build real del runner (Win32_OperatingSystem) : $realBuild"
          Write-Host "Version que REPORTA InnoSetup                 : $detected"
          Write-Host "Sonda normal   (modern=MinVersion 10.0)       : $normalPick"
          Write-Host "Sonda invertida (legacy=MinVersion 10.0)      : $flipPick"
          Write-Host "========================================="

          $fail = $false

          # P1 — la trampa del manifest. Si Inno reportara 6.x en un Windows 10+,
          # MinVersion: 10.0 jamás se cumpliría y todo caería a legacy en silencio.
          if ($realBuild -ge 10240 -and $detected -notlike '10.*') {
            Write-Host "::error::P1 FALLA — InnoSetup reporta '$detected' en un build $realBuild. Miente: la variante InnoSetup del ADR-023 NO es viable."
            $fail = $true
          } else {
            Write-Host "P1 OK — InnoSetup reporta la version verdadera ($detected), no 6.x."
          }

          # P2 — que discrimine y no dependa del orden de [Files].
          if ($normalPick -ne 'MODERN') {
            Write-Host "::error::P2 FALLA — la sonda normal instalo '$normalPick', se esperaba MODERN."
            $fail = $true
          }
          if ($flipPick -ne "LEGACY") {
            Write-Host "::error::P2 FALLA — la sonda invertida instalo '$flipPick', se esperaba LEGACY. Si coincide con la normal, decide el ORDEN y no la condicion."
            $fail = $true
          }
          if (-not $fail) {
            Write-Host "P2 OK — invertir las condiciones sin tocar el orden cambio el archivo instalado."
          }

          if ($fail) { exit 1 }

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-evidence
          path: |
            log-normal.txt
            log-flip.txt
            runner-os.txt
            selected-normal.txt
            selected-flip.txt
          retention-days: 7

  # El instalador de PRODUCTO, no la sonda. Compila `build/setup.iss` tal cual se
  # publica y comprueba que en un Windows moderno deja en disco el binario
  # moderno. Es lo que cierra la brecha que este workflow arrastraba: hasta T017,
  # el mecanismo estaba verificado en un archivo que no era el que se envía.
  #
  # Los "binarios" son testigos de texto A PROPÓSITO, por dos razones:
  #   - lo que se mide acá es la SELECCIÓN, y para eso un archivo distinguible
  #     alcanza; el toolchain de cada binario se mide en el release.yml (T020);
  #   - con testigos, el `-m installsvc` del DeinitializeSetup no tiene nada que
  #     registrar, así que este job no deja un servicio dando vueltas en el runner:
  #     el "observeragent.exe" instalado es un archivo de texto y Windows se niega
  #     a ejecutarlo. Esa —y no el /DIR— es la razón por la que el job es inocuo.
  #     Hasta el arreglo de las rutas divergentes 386 × x64, el DeinitializeSetup
  #     tenía el directorio fijo y el /DIR bastaba para dejarlo apuntando al vacío;
  #     ahora usa {app}, que sí es el directorio donde este job instala.
  real-setup-iss:
    name: El setup.iss real elige el binario moderno
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Preparar los dos testigos con el nombre real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $PWD 'stage_real'
          New-Item -ItemType Directory -Force -Path $src, (Join-Path $PWD 'out_real') | Out-Null
          # Los nombres son los que espera build/setup.iss. Si alguien los cambia
          # ahí sin cambiarlos acá, ISCC falla en compilación: es intencional.
          [System.IO.File]::WriteAllText((Join-Path $src 'observeragent-modern.exe'), 'MODERN')
          [System.IO.File]::WriteAllText((Join-Path $src 'observeragent-legacy.exe'), 'LEGACY')

      - name: Compilar el instalador real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $src  = (Resolve-Path stage_real).Path
          $out  = (Resolve-Path out_real).Path
          & $iscc "build\setup.iss" "/DAgentSrc=$src" "/DMyAppVersion=0.0.0" "/O$out" "/Frealprobe"
          if ($LASTEXITCODE -ne 0) { throw "ISCC fallo compilando build/setup.iss" }

      - name: Instalar y leer el veredicto del disco
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\observer-real-check'
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          & .\out_real\realprobe.exe /VERYSILENT /SUPPRESSMSGBOXES "/DIR=$dest" "/LOG=$PWD\log-real.txt" | Out-Null

          # Se espera al efecto en disco, no al exit code: el .exe de Inno se
          # desprende de la consola y puede retornar antes de terminar.
          $placed   = Join-Path $dest 'observeragent.exe'
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $placed) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }

          $realBuild = [int](Get-CimInstance Win32_OperatingSystem).BuildNumber
          # El veredicto se lee del DISCO, nunca del log: Inno registra también los
          # archivos que DESCARTA por condicion de version, asi que un grep sobre el
          # log da un falso positivo garantizado.
          $pick = if (Test-Path $placed) { (Get-Content -Raw $placed).Trim() } else { '<NADA INSTALADO>' }

          Write-Host "=============== VEREDICTO (setup.iss real) ==============="
          Write-Host "Build real del runner : $realBuild"
          Write-Host "DestName en disco     : $placed"
          Write-Host "Contenido instalado   : $pick"
          Write-Host "=========================================================="

          if ($realBuild -lt 10240) {
            Write-Host "::warning::runner con build $realBuild (<10240): este job asume Windows 10+."
            exit 0
          }
          if ($pick -eq 'LEGACY') {
            throw "el setup.iss real dejo el binario LEGACY en un Windows $realBuild. El corte MinVersion: 10.0 no esta discriminando: toda la flota moderna recibiria un agente sin parches de Go desde 2023, y el instalador terminaria en exito."
          }
          if ($pick -ne 'MODERN') {
            throw "el setup.iss real no dejo ningun binario en disco ($pick)."
          }
          Write-Host "OK - el instalador de producto entrega el binario moderno en Windows $realBuild."

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-setup-iss-evidence
          path: log-real.txt
          retention-days: 7

  # Afirma sobre la REDACCIÓN de las dos entradas, no sobre una corrida. Existe
  # porque los modos de falla de esta pieza son mudos en tiempo de ejecución
  # sobre un runner moderno: si las dos entradas dejan de compartir DestName, el
  # equipo termina con dos ejecutables y un servicio apuntando al que no es; si
  # se cae la línea legacy, Win7 deja de recibir binario y nadie lo nota desde
  # acá, porque no hay runner Win7 que falle.
  estructura:
    name: Las dos entradas de [Files] siguen bien redactadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar build/setup.iss
        run: |
          set -uo pipefail
          iss=build/setup.iss
          fail=0
          assert() {
            if [ "$1" = "ok" ]; then echo "OK   $2"; else echo "::error::$2"; fail=1; fi
          }

          n=$(grep -c '^Source:' "$iss")
          [ "$n" -eq 2 ] && r=ok || r=no
          assert "$r" "[Files] tiene exactamente 2 entradas Source (encontradas: $n)."

          n=$(grep '^Source:' "$iss" | grep -c 'DestName: "{#MyAppExeName}"')
          [ "$n" -eq 2 ] && r=ok || r=no
          assert "$r" "las 2 entradas comparten DestName (encontradas: $n). Sin DestName comun el equipo termina con dos ejecutables."

          grep '^Source:' "$iss" | grep -F 'observeragent-modern.exe' | grep -q 'MinVersion: 10\.0' && r=ok || r=no
          assert "$r" "el binario moderno esta condicionado con MinVersion: 10.0."

          grep '^Source:' "$iss" | grep -F 'observeragent-legacy.exe' | grep -q 'OnlyBelowVersion: 10\.0' && r=ok || r=no
          assert "$r" "el binario legacy esta condicionado con OnlyBelowVersion: 10.0."

          # El piso del instalador NO es el corte. Si alguien lo confunde y lo sube
          # a 10.0, Win7 deja de poder instalar y la rama legacy queda muerta.
          grep -q '^MinVersion=6\.1$' "$iss" && r=ok || r=no
          assert "$r" "[Setup] conserva el piso global MinVersion=6.1 (Win7 SP1)."

          exit $fail
