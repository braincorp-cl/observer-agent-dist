name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.13'

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY="observeragent-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o "${BINARY}"
          echo "BINARY=${BINARY}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}
          path: ${{ env.BINARY }}
          retention-days: 1

  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, "386"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.13'

      - name: Set version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build agent binary
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build_stage
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o build_stage/observeragent.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_out | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $src  = (Resolve-Path build_stage).Path
          $out  = (Resolve-Path installer_out).Path
          $base = "observeragent-${{ github.ref_name }}-windows-${{ matrix.goarch }}"
          & $iscc "build\setup.iss" "/DAgentSrc=$src" "/DMyAppVersion=${{ steps.version.outputs.VERSION }}" "/O$out" "/F$base"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: observeragent-${{ github.ref_name }}-windows-${{ matrix.goarch }}
          path: installer_out/observeragent-${{ github.ref_name }}-windows-${{ matrix.goarch }}.exe
          retention-days: 1

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, build-windows-installer]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
