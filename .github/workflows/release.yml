name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Todo release nuevo DEBE traer el detalle de los cambios de la version.
  # Esto corre ANTES de compilar y corta el release si falta el archivo, por dos
  # razones: falla en segundos en vez de despues de ~3 min de builds, y no deja
  # publicada una release a medias que despues haya que editar a mano.
  #
  # El motivo del gate: `generate_release_notes` produce un enlace "Full Changelog"
  # y nada mas, y una lista de mensajes de commit no le sirve a quien tiene que
  # decidir si actualiza la flota. Entre v2.11.0 y v2.14.2 —nueve releases— todas
  # salieron con ese stub. Ver release-notes/README.md.
  validate-notes:
    name: Validate release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release-notes/<tag>.md exists and is not a stub
        run: |
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Falta $NOTES. Todo release debe traer el detalle de los cambios de la version (ver release-notes/README.md)."
            exit 1
          fi
          if ! grep -q '^## Cambios en esta versión' "$NOTES"; then
            echo "::error::$NOTES no tiene la seccion '## Cambios en esta versión'."
            exit 1
          fi
          # Un archivo con el encabezado pero sin vinetas debajo es un stub.
          if ! awk '/^## Cambios en esta versión/{f=1; next} /^## /{f=0} f && /^- /{found=1} END{exit !found}' "$NOTES"; then
            echo "::error::$NOTES no lista ningun cambio bajo '## Cambios en esta versión'."
            exit 1
          fi
          echo "OK: $NOTES ($(wc -l < "$NOTES") lineas)"

  build:
    name: Build binaries
    needs: [validate-notes]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY="observeragent-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o "${BINARY}"
          echo "BINARY=${BINARY}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}
          path: ${{ env.BINARY }}
          retention-days: 1

  # Feature 025: macOS ya NO se cross-compila desde Linux. El proveedor de
  # ubicación es CoreLocation (Objective-C vía cgo), que exige SDK de macOS, y el
  # binario necesita dos cosas más que solo se pueden hacer acá:
  #   1. Embeber el Info.plist en (__TEXT,__info_plist). Sin él CoreLocation
  #      deniega de inmediato y locationd ni siquiera registra al cliente.
  #      Va por -extldflags porque cgo RECHAZA -sectcreate en #cgo LDFLAGS.
  #   2. Firmar con --identifier IGUAL al CFBundleIdentifier del plist. Con el
  #      identificador que pone el linker de Go por defecto ("a.out") locationd
  #      no registra al cliente. Ambos hallazgos están validados en un Mac real.
  # Ambas arquitecturas salen del runner Apple Silicon: los runners Intel
  # (macos-13) ya no se asignan —GitHub los está retirando— y dejaban el release
  # colgado en cola indefinidamente. El SDK de macOS es universal, así que el
  # cross-compile a x86_64 con cgo funciona pasándole el -arch a clang.
  build-macos:
    name: Build macOS binaries
    needs: [validate-notes]
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY="observeragent-${{ github.ref_name }}-darwin-${{ matrix.goarch }}"
          PLIST="$(pwd)/agent/Info.darwin.plist"
          # cgo no infiere la arquitectura destino: hay que decirle a clang que
          # cruce a x86_64 cuando se compila amd64 en un runner Apple Silicon.
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            export CGO_CFLAGS="-arch x86_64"
            export CGO_LDFLAGS="-arch x86_64"
          fi
          go build \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }} -extldflags -Wl,-sectcreate,__TEXT,__info_plist,${PLIST}" \
            -o "${BINARY}"
          # El identificador debe coincidir con CFBundleIdentifier (ver arriba).
          codesign -f -s - --identifier cl.observer.agent "${BINARY}"
          echo "BINARY=${BINARY}" >> $GITHUB_ENV

      - name: Verify Info.plist and signing identity
        run: |
          # Falla el release si el binario sale sin plist embebido o mal firmado:
          # ambos son silenciosos en runtime (el agente degradaría a IP sin avisar).
          otool -s __TEXT __info_plist "${BINARY}" | grep -q "__info_plist" \
            || { echo "::error::falta la sección __info_plist"; exit 1; }
          codesign -dv "${BINARY}" 2>&1 | grep -q "Identifier=cl.observer.agent" \
            || { echo "::error::identificador de firma incorrecto"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}
          path: ${{ env.BINARY }}
          retention-days: 1

  build-windows-installer:
    name: Build Windows installer
    needs: [validate-notes]
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, "386"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'

      - name: Set version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build agent binary
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build_stage
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o build_stage/observeragent.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_out | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $src  = (Resolve-Path build_stage).Path
          $out  = (Resolve-Path installer_out).Path
          $base = "observeragent-${{ github.ref_name }}-windows-${{ matrix.goarch }}"
          & $iscc "build\setup.iss" "/DAgentSrc=$src" "/DMyAppVersion=${{ steps.version.outputs.VERSION }}" "/O$out" "/F$base"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: observeragent-${{ github.ref_name }}-windows-${{ matrix.goarch }}
          path: installer_out/observeragent-${{ github.ref_name }}-windows-${{ matrix.goarch }}.exe
          retention-days: 1

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [validate-notes, build, build-macos, build-windows-installer]
    steps:
      # El checkout es solo para poder leer release-notes/<tag>.md: este job antes
      # no clonaba el repo porque le bastaban los artifacts.
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          # El cuerpo sale del archivo versionado, NO de generate_release_notes
          # (que solo emite un enlace "Full Changelog"). El job validate-notes ya
          # garantizo que el archivo existe y lista cambios.
          name: Observer RMM Agent ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Publica los binarios en el CDN propio agents.observer.cl (appserver, WebDAV
      # autenticado sobre HTTPS). Es el mecanismo de copia definitivo: se dispara en
      # cada release, sin control-plane intermedio ni credenciales de GitHub en el server.
      # Requiere los secrets CDN_UPLOAD_USER / CDN_UPLOAD_PASSWORD del repo y que
      # agents.observer.cl este publicado por el NPM. No bloquea el release si falla.
      - name: Publish binaries to agents.observer.cl CDN
        continue-on-error: true
        env:
          CDN_USER: ${{ secrets.CDN_UPLOAD_USER }}
          CDN_PASS: ${{ secrets.CDN_UPLOAD_PASSWORD }}
        run: |
          if [ -z "$CDN_USER" ] || [ -z "$CDN_PASS" ]; then
            echo "::warning::Secrets CDN_UPLOAD_USER/PASSWORD ausentes; se omite el push al CDN."
            exit 0
          fi
          base="https://agents.observer.cl/releases/download/${GITHUB_REF_NAME}"
          # --http1.1 es OBLIGATORIO: el runner de GitHub (Azure) sube con alto RTT hacia
          # Chile y sobre HTTP/2 el stream se resetea a media subida (curl 92 PROTOCOL_ERROR)
          # en binarios grandes (~10 MiB darwin). HTTP/1.1 es robusto para PUT grandes.
          # --retry-all-errors reintenta ante cortes transitorios de red del perimetro.
          CDN_CURL=(curl -fsS --http1.1 --retry 3 --retry-all-errors --retry-delay 5 -u "$CDN_USER:$CDN_PASS")
          echo "Creando coleccion $base/ ..."
          "${CDN_CURL[@]}" -X MKCOL "$base/" || true
          for f in binaries/observeragent-*; do
            [ -e "$f" ] || continue
            echo "Subiendo $(basename "$f") ..."
            "${CDN_CURL[@]}" -T "$f" "$base/$(basename "$f")"
          done
          echo "Publicacion al CDN completada para ${GITHUB_REF_NAME}."
